[tool.poetry]
name = "invox"
version = "0.1.0"
description = "A professional desktop billing and quotation management software."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
PyQt6 = "^6.6"
SQLAlchemy = "^2.0"
reportlab = "^4.0"
openpyxl = "^3.1"
flask = "^3.1.3"
pytest = "^9.1.1"

[[tool.poetry.packages]]
include = "invox"
from = "src"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"