{% extends "base.html" %}
{% block title %}Settings — INVOX{% endblock %}
{% block page_title %}Company Settings{% endblock %}

{% block content %}
<div class="card" style="max-width:720px;">
  <div class="card-header"><span class="card-title">Company Profile</span></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" name="company_name" value="{{ profile.company_name or '' }}">
      </div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone_number" value="{{ profile.phone_number or '' }}">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ profile.email or '' }}">
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address">{{ profile.address or '' }}</textarea>
      </div>
      <div class="form-group">
        <label>GST Number</label>
        <input type="text" name="gst_number" value="{{ profile.gst_number or '' }}" style="text-transform:uppercase;">
      </div>
      <div class="form-group">
        <label>Bank Details</label>
        <textarea name="bank_details" rows="3">{{ profile.bank_details or '' }}</textarea>
      </div>
      <div class="form-group">
        <label>Terms &amp; Conditions</label>
        <textarea name="terms_and_conditions" rows="4">{{ profile.terms_and_conditions or '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
